name: Comment benchmark results

on:
  workflow_run:
    workflows: ["Performance benchmarks"]
    types:
      - completed

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner) {
              core.setFailed('No head repository on workflow_run payload.');
              return;
            }
            const head = `${headOwner}:${run.head_branch}`;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              per_page: 100,
            });
            const matching = prs.filter(pr => pr.head.sha === run.head_sha);
            if (matching.length !== 1) {
              core.setFailed(`Expected one open pull request for ${head} at ${run.head_sha}, found ${matching.length}.`);
              return;
            }
            core.setOutput('number', String(matching[0].number));

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Performance benchmarks:\n\n' + output
            });
