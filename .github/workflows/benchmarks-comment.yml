name: Comment benchmark results

on:
  workflow_run:
    workflows: ["Performance benchmarks"]
    types:
      - completed

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number from workflow_run event
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            // workflow_run.pull_requests is always empty for PRs from forks,
            // so look the PR up through the API instead. Every input comes
            // from the trusted event payload, never from the uploaded artifact.
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            const headOwner = run.head_repository && run.head_repository.owner
              ? run.head_repository.owner.login
              : null;
            if (!headOwner) {
              core.setFailed('Head repository not found on workflow_run payload.');
              return;
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            });
            const matching = prs.filter(pr => pr.head && pr.head.sha === headSha);
            if (matching.length === 0) {
              core.setFailed(`No pull request with head SHA ${headSha} found on workflow_run payload.`);
              return;
            }
            if (matching.length > 1) {
              core.setFailed(`Multiple pull requests with head SHA ${headSha} found on workflow_run payload.`);
              return;
            }
            core.setOutput('number', String(matching[0].number));

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Performance benchmarks:\n\n' + output
            });
